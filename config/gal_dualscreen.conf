# gal_dualscreen configuration
#
# A LINE STARTING WITH # IS OFF. To use a setting, delete the # at the very
# start of its line, then run the install again and reboot.
#
# Copy to the SD card root as gal_dualscreen.conf and the hook reads it at
# startup: /fs/sdb0/gal_dualscreen.conf, falling back to
# /tmp/gal_dualscreen.conf, or wherever GAL_HOOK_CONF points.
#
# Why this file exists: smartphone_integrator silently drops the WHOLE
# environment array past about ten entries -- GAL then starts with no
# LD_PRELOAD at all while the config on disk still looks correct. That caps
# how many switches can be delivered as environment variables. This file
# has no such limit, and it can be edited between boots without re-running
# enable_hook.sh and without touching the system config.
#
# Anything enable_hook.sh injects into the environment WINS over this file:
# the environment is what was deliberately installed, this is the default.
# Blank lines, # comments and lines without '=' are ignored; whitespace
# around keys and values is trimmed.

# YOUR CHANGES ARE KEPT: each install remembers the lines you changed here,
# and the next install puts them back wherever the new card still has the
# shipped default, so a new zip's fresh file does not lose them. A line you
# change on the new card always wins. The install lists what it kept in
# update_result.txt. For a clean install with only this card's settings,
# remove the # from the next line. The uninstall forgets them.
#CLUSTERMAP_KEEP_SETTINGS=0

# ---- master switches -------------------------------------------------
GAL_DUALSCREEN_ENABLE=1
GAL_DUALSCREEN_DEBUG=0

# ---- what to do with the secondary sink's video ----------------------
# gal       forward to GAL. Reconfigures the one shared CVideoRenderer and
#           blanks the main screen. Stock path.
# withhold  do not forward, do not decode. Frames still arrive and are
#           counted; main screen untouched. Used for streaming to stream-player.
# own       decode into our own NvSS instance on the target displayable.
GAL_DUALSCREEN_OUTPUT=withhold

# ---- where the picture goes -----------------------------------------
# The displayable to decode onto. Stock knows 16, 59 (main smartphone),
# 19, 22, 23 and 33 (KOMBI_MAP_VIEW, already 800x480 and already routed to
# the cluster by context 70). 3 does not exist until something creates it;
# VcMOSTRenderMqb's OpenGL player creates it that way and it works, but
# whether NvSS can is exactly what is being tested.
GAL_VC_DISPLAYABLE_ID=3
# Display Manager context that holds it, and the display to point at it.
# The VC's display id for dmdt sc/sb is 4 -- NOT the 1 that dmdt gs prints
# as its index. dmdt accepts a wrong id and silently does nothing.
# 70 is VW, SEAT and Skoda. An Audi A4 B9 (K3346) shows its cockpit map in
# context 72 (74 with the route overlays), so Audi trials set 72 here; the
# player, the hook and the uninstaller all read it.
GAL_VC_CONTEXT=70
GAL_VC_DISPLAY=4
# Put back on teardown: 33 is the stock Kombi map.
GAL_VC_RESTORE_DISPLAYABLE_ID=33

# ---- geometry --------------------------------------------------------
# The frame the phone is asked for: 800x480, or 1280x720 with
# CLUSTERMAP_720P=1 below. Do not edit these two: the installer and the
# green menu write them from CLUSTERMAP_720P into the unit's copy, and the
# hook takes anything else back to 800x480 (config.resolution in its log).
#
# Note especially that 400x400 is NOT a resolution to set here. It is the
# visible area left after the stock 400x80 margins are cropped from an
# 800x480 coded frame.
GAL_SECONDARY_WIDTH=800
GAL_SECONDARY_HEIGHT=480
# 30 or 60 only -- gal.json states those are the supported rates, and the
# hook matches the primary's config table on (resolution, fps) to build the
# secondary, so an unsupported value means the secondary sink is never
# built. Note MOST caps cluster video well below 30 anyway (about 10fps
# stock, ~20 patched), so 30 here is the declared rate, not a promise.
GAL_SECONDARY_FPS=30
# UI scale, not a physical measurement. The firmware declares no cluster
# dpi at all, and gal.json calls its own value a "DPI override for tuning
# UI element size" -- the 213 it uses for the main screen is nowhere near
# that screen's true pixels-per-inch. Android converts dp to px as
# dp * dpi / 160, so LOWER normally draws the interface smaller. This is a
# UI-density/scale hint, not a claimed physical panel measurement.
# auto = what owners settled on for the car, filled in by the installer
# (Skoda 125). This fork: 110 for a smaller turn card on the Skoda, as the
# upstream developer suggested (steps of 10); a number here is kept as it is.
GAL_SECONDARY_DPI=110

# GAL_PRIMARY_DPI=<60 to 400>
# The same for Android Auto on the centre screen: lower shows smaller text
# and icons and more on screen, higher shows larger. Like the DPI setting of
# aawireless, which its passthrough mode loses. The unit's own value is 213
# (gal.json); one owner likes 138 through aawireless (#71). Leave the # in
# front for the unit's own value. Install again, then reconnect the phone.
# Car-tested upstream (#71); not yet on the Skoda.
#GAL_PRIMARY_DPI=160
# Camera/viewpoint hint, separate from UiConfig and DPI. Outer margins are
# set by the installer from the cluster map window (GAL_SECONDARY_MARGINS):
# none on an 800x480 window.
GAL_SECONDARY_VIEWING_DISTANCE=700
# Square pixels. Leave it at 10000; the installer writes the unit's copy.
GAL_SECONDARY_PIXEL_ASPECT_RATIO_E4=10000
# Upstream's sharper map (the whole 800x480 frame with wide pixels). This
# fork's standard is the 720p picture below, which is sharper still, so it
# is off; 1 still works where 720p is off.
CLUSTERMAP_FULL_FRAME=0
# 720p picture, this fork's standard: 1 asks the phone for a 1280x720 frame
# with margins that leave exactly the cockpit window (270x344 on 1010x376),
# so the phone draws the window's own pixels and the player shows them 1:1:
# no stretching, no squeezing, no scaling at all. Car-tested on a Superb
# (1.2.2-beta3): sharper than the sharper map. DPI and insets stay set as for
# the 800x298 band: the hook scales them to the window (1.2625 on 1010x376,
# DPI 110 to 139). 0 goes back to the 800x480 frame with margins, as
# upstream: only if the cockpit ever shows no map with 720p.
CLUSTERMAP_720P=1
# UI safe area: where the phone keeps the car, its turn card and the arrival
# time, inside the map. Order is top,bottom,left,right, in pixels of the
# 800x480 frame after margins (800x298 on a 1010x376 window). Raise a value
# if something hides behind the dials or a cluster warning light; a larger
# bottom keeps the map and your position clear of the lower edge. How big
# the turn card is, is GAL_SECONDARY_DPI above: lower it in steps of 10.
# What owners have settled on, per cluster, is in docs/Install.md.
# Values go up to 16383, but the setting has to fit in 15 bytes: with
# GAL_SECONDARY_UI_THEME=0 up to three of the four may be above 127, with
# 1 or 2 only one. Beyond that the smallest values above 127 are cut to 127,
# one at a time, until it fits (event=video.insets result=too_long in the
# hook log).
# auto (this fork): the insets of CLUSTERMAP_TURN_CARD below on the Skoda's
# 1010x376 window; on any other window the installer's values for the make.
# Four numbers here are used as they are and CLUSTERMAP_TURN_CARD is not.
GAL_SECONDARY_INSETS=auto
# Where Google Maps shows its green turn card, set through the insets above
# (measured on a Superb, 1010x376, DPI 110; they need GAL_SECONDARY_UI_THEME=0
# to fit the 15 bytes at 720p):
#   hidden     75,163,320,320: a 160x60 space at 25-45 percent of the height,
#              too short for the card, so Maps leaves it out; the car just
#              below the middle and the arrival time in a line at the bottom.
#              Car-tested (beta12, 1.2.2-beta3).
#   top_right  100,138,320,320: the same space 25 lines lower. Maps then shows
#              the card in the top right corner with the arrival time under
#              it, and the car lower down (car-tested, 1.2.2-beta4).
#   top_left   100,138,480,160: as top_right but the space moved right, so the
#              free room is on the left. Maps decides the side; not yet
#              car-tested.
# The green menu's "Turn card ..." entries switch it in the car, and the next
# install keeps that choice while this line says hidden.
# Learned on the way: a full-width space (0 left and right) lets Maps put
# the card at the side; 134,104,0,0 put the car behind the cockpit's lower
# bar; the card at the top (40,127,127,127) is half hidden by the cockpit's
# top line.
CLUSTERMAP_TURN_CARD=hidden
# Optional manual vertical crop of Android Auto's 800x480 frame. When either
# value is nonzero, the phone gets the full frame without installer margins,
# while retaining the configured pixel aspect ratio (including full-frame
# wide pixels). The player crops the remaining rows to the full window. For a
# 1440x455 window, 15 + 10 leaves exactly 455 source rows. Off unless you
# remove the # from both lines (tested upstream on an Audi A3 8V, #85; not on
# the Skoda, where the sharper map above does the same job).
#GAL_CROP_TOP=15
#GAL_CROP_BOTTOM=10
# The cockpit's map window, only for when the installer reports it as "not
# reported by the display manager". SEAT and Skoda clusters: 1010x376.
# When the display manager does list it, its size is used and this line is
# replaced in the unit's copy. This fork sets it for the Skoda, so a first
# install before the cockpit has shown its own map still gets 1010x376.
GAL_PLAYER_WINDOW=1010x376

# UI theme of the cluster map: 0 = automatic, day or night following the
# car's light sensor like the centre screen; 1 = always light; 2 = always
# dark. Waze picks its own colours and stays dark.
GAL_SECONDARY_UI_THEME=0
# Expert override: the exact UiConfig bytes, in hex, at most 15 bytes. When
# set it REPLACES the insets and theme above, so leave it unset unless you
# are testing payloads. 5a0a120808281028187f207f is what the two lines above
# produce.
#GAL_SECONDARY_UI_CONFIG_HEX=5a0a120808281028187f207f

# ---- Android Auto protocol ------------------------------------------
# The Android Auto protocol version the unit claims, 1.x. Stock is 2. The
# cluster map shows at 2 to 7. From 6, Google Maps sends newer navigation
# messages this unit cannot read, and the turn pictograms of the arrows jar
# stopped (#4: 2 to 5 worked, 6 did not). The hook now translates them into
# the old ones (GAL_DUALSCREEN_NAV_TRANSLATE below), so 6 and 7 should keep
# the pictograms too; not yet tested on a car. 7 is what Google's DHU
# negotiates. This fork: 5 as upstream from beta9. The Skoda settings
# above were car-tested at 7 and again at 5 (beta12, map and insets); go
# back to 7 if the insets, the day/night theme or the sharper map stop
# working.
GAL_DUALSCREEN_AAP_MINOR=5
# Translate Android Auto 1.6+ navigation messages for this unit (1 = on).
# Does nothing at 5 or lower. 0 turns it off, to compare.
#GAL_DUALSCREEN_NAV_TRANSLATE=0
# The phone only offers the second display when a cluster
# InputSourceService is advertised beside the video sink.
GAL_DUALSCREEN_CLUSTER_INPUT=1
# AAP display id for the cluster.
GAL_SECONDARY_AAP_DISPLAY_ID=1
# 0 = pick the first free service id after the primary.
GAL_SECONDARY_SERVICE_ID=0

# ---- bisect switches (all default ON; set 0 to isolate a behaviour) ---
#GAL_DUALSCREEN_SECOND_SINK=0
#GAL_DUALSCREEN_INJECT_META=0
# Acknowledge decoded frames ourselves. A working head unit acks EVERY
# media frame (1255 acks for 1256 frames in the DHU capture), and GAL
# drives that from the render path we bypass -- so without this the phone
# tears the stream down. Only turn it off to test that claim.
#GAL_DUALSCREEN_ACK=0

# ---- unexpected-message reply ---------------------------------------
# With a cluster display the phone sends navigation messages 0x8006 and
# 0x8007 that this receiver does not know. Its "unexpected message" reply
# makes the phone reset the link (a connection loop every ~17 s), so the
# hook drops the reply. Default on; 0 sends it as stock does.
# See docs/Development.md, "The connection loop".
#GAL_FIX_SUPPRESS_UNEXPECTED=0

# ---- hide "phone is navigating" from the head unit -------------------
# Default off. Set 1 if the cluster map is solid with no route and goes
# blank when a route starts even with VCAndroidAuto.jar removed. The hook
# then does not pass message 0x8003 NavigationStatus to the receiver.
#GAL_FIX_HIDE_NAV_STATUS=1

# ---- input experiments ----------------------------------------------
# Test harness for finding out which input zooms the cluster map. With 1,
# the hook reads requests from /tmp/gal_inject (see zoom_test.sh). Leave
# off in normal use.
#GAL_INPUT_INJECT=1
# Android keycodes advertised for the cluster input service. Default
# 23,65536 (DPAD centre and the rotary controller). At most 5 bytes of
# packed values: five codes below 128, or 65536 plus two.
#GAL_CLUSTER_KEYCODES=19,20,23

# ---- decoder -------------------------------------------------------------
# hw: the unit's own video decoder (libnvss_video.so, as gal uses for the
#     centre screen) draws the picture straight onto the cluster layer. Far
#     less processor time than software decoding. Not yet car-tested. If it
#     will not open, the player uses software; a failure while decoding
#     switches it off until the next reboot (/tmp/stream-player.hwdecode.off).
# sw: FFmpeg on the processor, drawn with OpenGL. The tested default.
GAL_PLAYER_DECODER=sw
# The decoder's output device, 0 or 1. 1 is what the Audi Tegra project uses
# for its cluster layer; try 0 if the cluster stays black with hw.
#GAL_PLAYER_NVSS_OUTPUT=1
# Colours: auto (the default) converts as the stream says, limited range
# (16-235) unless it says full, which is what phones send; before 1.2.2-beta3
# every stream was taken as full range, which made blacks grey and the map
# paler and softer. old puts that back, to compare. The player log names
# what it chose ("colour: ...").
#GAL_PLAYER_COLOR=old
# NEON: 1 (the default) decodes with the Tegra 3's NEON routines, except the
# few that access memory misaligned, which this unit's kernel does not allow
# (1.3.0-beta2 crashed in one at every start). Should the player still crash,
# it decodes without NEON until the next reboot by itself. 0 switches NEON
# off for good: slower (about 10 pictures a second at 720p), as in
# 1.2.2-beta4.
#GAL_PLAYER_NEON=0
# The player's scheduling priority, raised to this and never lowered; 0 or
# no line leaves it as spawned (QNX's default is 10). A little above 10 so
# the system's compositor stalls the cockpit map less (kamgurgul's MHI2Q
# renderer stalled for 300-650 ms at 10). Far higher could starve gal and the
# interface behind the software decoder. At most 20. The player log names
# the change ("priority: 10 -> 12"). This fork: 12.
GAL_PLAYER_PRIORITY=12

# ---- log volume -------------------------------------------------------
# Normal use: no per-frame debug lines, no once-a-second timing or player
# statistics, and a 1 MB cap on the hook log. The logs live in RAM
# (/tmp/gal_dualscreen.log, /tmp/stream-player.log) and are lost at
# reboot. For troubleshooting, reinstall with "enable_hook.sh --debug"
# and set the three values below back to 1, 1 and 10.
GAL_FIX_STREAM_TIMING=0
GAL_PLAYER_STATS=0
GAL_HOOK_LOG_MAX_MB=1

# ---- trial firmware profile (porting only) ----------------------------
# A profile for a firmware the hook has no built-in entry for, as printed by
# tools/find_profile.py. Used only if no built-in profile matches and its
# three fingerprint addresses equal this unit's. See
# docs/Development.md, "Adding a firmware".
#GAL_PROFILE_TRIAL=name:controller:impl_vt:cb_vt:ctor:first_word:size:ctl_cfg:ctl_creator:h_count:h_data:entry

# ---- logging ---------------------------------------------------------
# Unset by default: the hook uses its built-in path and falls back to
# /tmp/gal_dualscreen.log when the card is read-only, which it is on every
# boot. The status scripts search both.
#GAL_HOOK_LOG=/tmp/gal_dualscreen.log

# ---- legacy aliases (still read; prefer the keys above) ---------------
# Superseded by GAL_DUALSCREEN_OUTPUT, which covers the same axis:
# (GAL_DUALSCREEN_SECONDARY_RENDER was removed with the NvSS/own-render
# paths. Use GAL_DUALSCREEN_OUTPUT=withhold, which is the default.)
# Alias for GAL_VC_DISPLAYABLE_ID.
#GAL_SECONDARY_DISPLAY_ID=3

# ---------------------------------------------------------------------
# H.264 forwarding to a separate decoder process
# ---------------------------------------------------------------------
# Off unless set to exactly 1, so a hook carrying this feature behaves
# identically to one without it until you opt in. When enabled, the
# secondary sink's H.264 elementary stream is written to a TCP socket on
# loopback, and the frame is acked to the phone whether or not the write
# succeeded -- withholding acks would stall the AA session rather than
# just dropping a frame.
#
# Consume it with VcMOSTRenderMqb's stream-player on the same unit:
#     ./stream-player tcp://127.0.0.1:12346
# It passes a NULL input format to avformat_open_input, so FFmpeg probes
# the stream and finds Annex-B H.264 from its start codes; no container
# is needed. If the probe struggles, give it --probe-size and
# --analyze-duration.
GAL_STREAM_ENABLE=1

# Keep the turn-arrows jar (VCAndroidAuto.jar) loaded with the map, adding it
# if missing. On SEAT the map, arrows and music work together. Leave it at 0
# on VW: the map goes blank when a route starts, and a Golf cockpit switched
# to its own arrow view and stayed there until the arrows were removed. Install again
# after changing it; Uninstall removes a jar added this way.
CLUSTERMAP_KEEP_ARROWS=0

# 1 = show the track playing (title, artist, cover) on the cockpit's media
# screen with the map, from a music-only build of the arrows jar
# (VCAndroidAutoMusic.jar). It sends no turn data, so the map stays up when a
# route starts. Ignored with CLUSTERMAP_KEEP_ARROWS=1, whose jar shows the
# Android Auto music itself. Only on the trains the arrows jar is known on
# (P4521, K4525, P4708, P4709; "arrows" in profiles.conf): the Skoda P4526
# is not one of them yet, so the installer ignores this line there. Install
# again after changing it; Uninstall removes it. Not car-tested yet.
#CLUSTERMAP_MUSIC_INFO=1

# 1 = Android Auto turn info with the map: a build of the arrows jar
# (VCAndroidAutoTurns.jar) that sends the turn data but, unlike
# CLUSTERMAP_KEEP_ARROWS=1, never tells the cockpit to switch to its arrow
# view. The cockpit should stay on the map and draw its own arrow and
# distance beside it. Includes the track info of CLUSTERMAP_MUSIC_INFO and
# wins if both are set. Same trains (so not yet the Skoda P4526), ignored
# with CLUSTERMAP_KEEP_ARROWS=1.
# If the cockpit still switches to the arrow view, press OK to go back to
# the map and tell us. Install again after changing it; Uninstall removes
# it. Tested on a Golf R P4521: map kept, arrow in the right dial, road name
# above the map.
#CLUSTERMAP_TURN_INFO=1

# CLUSTERMAP_TURN_TEXT=auto|always|never (with CLUSTERMAP_TURN_INFO=1)
# When the cockpit gets the road name ("towards ..."). auto: only while the
# cockpit is not showing the map, because Google Maps' card already shows it
# there. always: as in v1.1.1-beta19-turns1 (the text twice with the map).
# never: arrow and distance only.
#CLUSTERMAP_TURN_TEXT=auto

# 1 = add the NavActiveIgnore patch on firmware where it is not added
# automatically. Without it the cluster drops the map as soon as the phone
# starts a route ("navigation on mobile device is active"). Automatic on
# P4521, K4525, P4512, US P3662, Skoda P4526 and SEAT P4709. It edits the
# script that starts the centre screen: on a firmware it does not fit, the
# centre screen may not start. Check SSH works before you set this; the
# recovery is in docs/Install.md, Safety and recovery. Uninstall removes it.
CLUSTERMAP_ADD_NAVIGNORE=0

# Loopback port to listen on. Default 12346.
